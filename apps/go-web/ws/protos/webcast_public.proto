syntax = "proto3";

option go_package = "./dy";

// 通用图像结构
message Image {
  repeated string url_list = 1;
  repeated string flex_setting_list = 2;
  repeated string text_setting_list = 3;
  string uri = 4;
  string height = 5;
  string width = 6;
  string avg_color = 7;
  int32 image_type = 8;
  string open_web_url = 9;
  bool is_animated = 10;
}

// 通用消息结构
message Common {
  string method = 1;
  string msg_id = 2;
  string room_id = 3;
  string create_time = 4;
  int32 monitor = 5;
  bool is_show_msg = 6;
  string describe = 7;
  string fold_type = 8;
  string anchor_fold_type = 9;
  string priority_score = 10;
  string log_id = 11;
  string msg_process_filter_k = 12;
  string msg_process_filter_v = 13;
  string anchor_fold_type_v2 = 14;
  string process_at_sei_time_ms = 15;
  string random_dispatch_ms = 16;
  bool is_dispatch = 17;
  string channel_id = 18;
  string diff_sei2abs_second = 19;
  string anchor_fold_duration = 20;
  string app_id = 21;
}

// 徽章内容
message BadgeContent {
  string name = 1;
  string font_color = 2;
  string level = 3;
  string alternative_text = 4;
}

// 用户徽章
message BadgeImage {
  Image icons = 1;
  string title = 2;
}

// 粉丝俱乐部数据
message FansClubData {
  repeated string available_gift_ids = 1;
  string club_name = 2;
  int32 level = 3;
  int32 user_fans_cluster_status = 4;
  string anchor_id = 5;
  int32 badge_type = 6;
  int32 user_guard_status = 7;
  string guard_expired_time = 8;
  string anchor_open_id = 9;
  BadgeImage badge = 10;
}

// 付费等级信息
message PayGrade {
  repeated Image grade_icon_list = 1;
  string total_diamond_count = 2;
  string name = 3;
  string next_name = 4;
  string level = 5;
  string next_diamond = 6;
  string now_diamond = 7;
  string this_grade_min_diamond = 8;
  string this_grade_max_diamond = 9;
  string pay_diamond_bak = 10;
  string grade_describe = 11;
  string screen_chat_type = 12;
  string upgrade_need_consume = 13;
  string next_privileges = 14;
  string score = 15;
  bool grade_describe_shining = 16;
  string grade_banner = 17;
  Image new_im_icon_with_level = 18;
  Image new_live_icon = 19;
}

// 关注信息
message FollowInfo {
  string following_count = 1;
  string follower_count = 2;
  string follow_status = 3;
  string push_status = 4;
  string remark_name = 5;
  string follower_count_str = 6;
  string following_count_str = 7;
  bool invalid_follow_status = 8;
  string follwer_count_display = 9;
}

// 公共区域徽章信息
message PublicAreaBadgeInfo {
  map<int32, Image> badge_info_map = 1;
  repeated string badge_list = 2;
  repeated string webcast_dsl_badge_list = 3;
}

// 公共区域通用信息
message PublicAreaCommon {
  map<string, string> individual_strategy_result = 1; // 个体策略结果
  map<string, string> tracking_params = 2;      // 追踪参数
  string user_consume_in_room = 3;              // 用户在房间消费
  string user_send_gift_cnt_in_room = 4;        // 用户在房间送礼数
  string individual_priority = 5;               // 个体优先级
  string support_pin = 6;                       // 是否支持置顶
  int32 im_action = 7;                          // IM动作
  bool forbidden_profile = 8;                   // 是否禁止资料
  string is_featured = 9;                       // 是否精选
  bool need_filter_display = 10;                // 是否需要过滤显示
  string force_insertion_priority = 11;         // 强制插入优先级
  Image user_label = 12;
}

// ========== 新增内容 ========== //
message JAccreditInfo {
  int32 j_accredit_basic = 1;    // 基础认证状态
  int32 j_accredit_advance = 2;  // 高级认证状态
  int32 j_accredit_content = 3;  // 内容认证状态
  int32 j_accredit_live = 4;     // 直播认证状态
}

