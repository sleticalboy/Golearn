  int32 level = 13;
  string birthday = 14;
  string telephone = 15;
  bool verified = 16;
  int32 experience = 17;
  string city = 18;
  int32 status = 19;
  string create_time = 20;
  string modify_time = 21;
  int32 secret = 22;
  string share_qrcode_uri = 23;
  int32 income_share_percent = 24;
  string special_id = 25;
  string top_vip_no = 26;
  string pay_score = 27;
  string ticket_count = 28;
  int32 link_mic_stats = 29;
  string display_id = 30;
  bool with_commerce_permission = 31;
  bool with_fusion_shop_entry = 32;
  string total_recharge_diamond_count = 33;
  string verified_content = 34;
  string sec_uid = 35;
  int32 user_role = 36;
  int32 authorization_info = 37;
  int32 adversary_authorization_info = 38;
  int32 adversary_user_status = 39;
  string location_city = 40;
  string remark_name = 41;
  int32 mystery_man = 42;
  string web_rid = 43;
  string desensitized_nickname = 44;
  bool is_anonymous = 45;
  int32 consume_diamond_level = 46;
  string webcast_uid = 47;
  string public_area_oper_freq = 48;
  bool user_canceled = 49;
  bool allow_be_located = 50;
  bool allow_find_by_contacts = 51;
  bool allow_others_download_video = 52;
  bool allow_others_download_when_sharing_video = 53;
  bool allow_share_show_profile = 54;
  bool allow_show_in_gossip = 55;
  bool allow_show_my_action = 56;
  bool allow_strange_comment = 57;
  bool allow_unfollower_comment = 58;
  bool allow_use_linkmic = 59;
  string bg_img_url = 60;
  string birthday_description = 61;
  bool birthday_valid = 62;
  int32 block_status = 63;
  int32 comment_restrict = 64;
  string constellation = 65;
  int32 disable_ichat = 66;
  string enable_ichat_img = 67;
  int32 exp = 68;
  string fan_ticket_count = 69;
  bool fold_stranger_chat = 70;
  string follow_status = 71;
  bool hotsoon_verified = 72;
  string hotsoon_verified_reason = 73;
  int32 ichat_restrict_type = 74;
  string id_str = 75;
  bool is_follower = 76;
  bool is_following = 77;
  bool need_profile_guide = 78;
  string pay_scores = 79;
  bool push_comment_status = 80;
  bool push_digg = 81;
  bool push_follow = 82;
  bool push_friend_action = 83;
  bool push_ichat = 84;
  bool push_status = 85;
  bool push_video_post = 86;
  bool push_video_recommend = 87;
  bool verified_mobile = 88;
