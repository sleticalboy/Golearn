  Image avatar_thumb = 95;
  FollowInfo follow_info = 96;
  PayGrade pay_grade = 97;
  FansClubData fans_club = 98;
  PublicAreaBadgeInfo public_area_badge_info = 99;
  PublicAreaCommon public_area_common = 100;
  JAccreditInfo j_accredit_info = 101;
}

message UserValue {
  bool with_colon = 1;           // 是否带冒号
  bool self_show_real_name = 2;  // 是否显示真实姓名
  int32 left_show_extension = 3; // 左侧扩展显示
  string left_additional_content = 4; // 左侧附加内容
  string right_additional_content = 5; // 右侧附加内容
  User user = 6;                 // 复用之前定义的User结构
}

message TextFormat {
  string color = 1;              // 颜色值
  bool bold = 2;                 // 加粗
  bool italic = 3;               // 斜体
  int32 weight = 4;              // 字重
  int32 italic_angle = 5;        // 倾斜角度
  int32 font_size = 6;           // 字体大小
  bool use_heigh_light_color = 7; // 使用高亮色
  bool use_remote_clor = 8;      // 使用远程颜色
  bool ignore_color_mapping = 9; // 忽略颜色映射
}

message DisplayTextPiece {
  int32 type = 1;                  // 类型
  string value_ref = 2;            // 值引用
  string string_value = 3;         // 字符串值
  string schema_key = 4;           // schema键
  TextFormat format = 5;           // 文本格式
  UserValue user_value = 6;        // 用户值
}