<h1>{{.}}</h1>
<form action="/api/v1/login" method="post" target="_parent">
    用户名：<label><input type="text" name="username" autocomplete="username"></label><br>
    密码：<label><input type="password" name="username" autocomplete="current-password"></label><br>
    <button name="submit" type="submit">提交</button>
</form>

<input id="input" type="text"/>
<button onclick="send()">Send</button>
<div id="output"></div>

<script>
    if (window.WebSocket) {
        console.log("支持websocket")
    } else {
        console.log("不支持websocket")
    }

    function connws(url, tp, onmessage) {
        const ws = new WebSocket(url);
        ws.onopen = function () {
            console.log("连接成功 -> " + tp)
        }
        ws.onclose = function () {
            console.log("连接关闭 -> " + tp)
        }
        ws.onmessage = onmessage;
        ws.onerror = function (error) {
            console.error("WebSocket Error: ", error, ", tp -> " + tp);
        };
        return ws;
    }

    // echo ws
    const echoWs = connws(`ws://192.168.2.119:8099/ws`, "echoWs", function (event) {
        let d = JSON.parse(event.data);
        document.getElementById("output").innerHTML += `<p>${JSON.stringify(d, null, 2)}</p>`;
    })

    function send() {
        const input = document.getElementById("input");
        if (input.value === "") {
            console.error("输入不能为空")
            return;
        }
        if (!echoWs || echoWs.readyState !== WebSocket.OPEN) {
            console.error("WebSocket未连接")
            return;
        }
        if (input.value === "quit" || input.value === "q") {
            echoWs.close();
            return;
        }
        // 循环发送消息
        for (let i = 0; i < 10; i++) {
            echoWs.send(JSON.stringify({
                "type": "common",
                "data": `${input.value} - ${i + 1}`,
            }));
        }
        input.value = "";
    }
</script>
